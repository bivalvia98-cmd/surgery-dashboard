# 실제로 수술이 없었던 기간 (대시보드에 회색 음영 + 주석 표시)
gap_periods:
  - from: "2024-07"
    to:   "2025-08"
    label: "수술 미시행 기간"

# ------------------------------------------------------------
# 0. 동맥류 치료 건수 정의  (2026-08-10 확정: 809건 기준)
#    Dx 가 UIA 또는 SAH 이면서, 아래 조건 중 하나를 만족하는 행만 '동맥류 치료'로 집계
#      - Op name 이 0(clip) 또는 1(coil)                      -> 804건
#      - Op name 이 'angio only' (시도했으나 조영술만 하고 종료) ->   5건
#    * 'failure of procedure' 3건은 제외 (포함하려면 아래 include_failure 를 true 로)
#    * 주의: Op name=1(coil) 675건 중 74건은 DAVF/CCF/AVF/종양 이므로
#            반드시 Dx 와 교차 확인해야 함 (아래 aneurysm_dx 로 처리)
# ------------------------------------------------------------
aneurysm:
  aneurysm_dx: [UIA, SAH]
  include_angio_only: true      # +5건  => 809
  include_failure: false        # +3건  => 812

# ------------------------------------------------------------
# 0-b. 시술자 처리
#    시술자에 C 가 없는 45건(OSW/LJK/CWC/CDY/LHJ/HGH, 2018~2023년)도
#    전부 C 로 간주하여 포함 (2026-08-10 확정). 시술자는 분석 축으로 쓰지 않음.
# ------------------------------------------------------------
operator:
  force_all_to: C

